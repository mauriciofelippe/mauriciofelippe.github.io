---
layout: default
---

<article class="section">
  <div class="container container-narrow">
    <div style="margin-bottom: 2rem;">
      <a href="{{ '/blog/' | relative_url }}" class="section-link" style="margin-bottom: 1rem; display: inline-flex;">&larr; Back to Devlog</a>
      <span class="card-badge" style="position: static; margin-bottom: 0.75rem; display: inline-block;">{{ page.category | default: "Devlog" }}</span>
      <h1 class="hero-title" style="font-size: 2.5rem; text-align: left; margin-bottom: 0.5rem;">{{ page.title }}</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">
        Published on {{ page.date | date: "%B %d, %Y" }} &bull; By Mauricio Felippe
      </p>
    </div>

    <div class="prose">
      {{ content }}
    </div>

    <div style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between;">
      <a href="{{ '/blog/' | relative_url }}" class="btn btn-secondary">&larr; All Devlogs</a>
      <a href="https://github.com/mauriciofelippe" target="_blank" rel="noopener" class="btn btn-secondary">Follow on GitHub</a>
    </div>
  </div>
</article>
